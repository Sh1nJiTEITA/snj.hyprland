# Игнорировать запрос на максимизацию для всех окон
windowrule = suppress_event maximize, match:class .* # Исправление для xwaylandvideobridge (чтобы он был невидимым)
windowrule = opacity 0.0 override 0.0 override, match:class ^(xwaylandvideobridge)$
windowrule = no_anim on, match:class ^(xwaylandvideobridge)$
windowrule = no_initial_focus on, match:class ^(xwaylandvideobridge)$
windowrule = max_size 1 1, match:class ^(xwaylandvideobridge)$
windowrule = no_blur on, match:class ^(xwaylandvideobridge)$

# Firefox: установка четкой непрозрачности 0.9 (активное и неактивное)
windowrule = opacity 0.9 override 0.9 override, match:class ^(firefox)$

# Dunst, Nemo, Vesktop, Obsidian: прозрачность через override
windowrule = opacity 0.8 override, match:class ^(dunst)$
windowrule = opacity 0.85 override, match:class ^(nemo)$
windowrule = opacity 1.0 override, match:class ^(Nemo-menu)$
windowrule = opacity 0.85 override, match:class ^(vesktop)$
windowrule = opacity 0.85 override, match:class ^(obsidian)$
windowrule = opacity 0.9 override, match:class ^(org.telegram.desktop)$

# Waypaper и Snjwidget
windowrule = float on, match:class ^(waypaper)$
windowrule = opacity 0.85 override, match:class ^(waypaper)$
# windowrule = float, match:title ^(snjwidget)$

# Spotify: плавающее окно по центру с фиксированным размером
windowrule = float on, match:class ^(spotify)$
windowrule = size 1800 1000, match:class ^(spotify)$
windowrule = center on, match:class ^(spotify)$

# Диалоги выбора файлов
windowrule = float on, match:class (Xdg-desktop-portal-gtk), match:title (Open File)
windowrule = float on, match:class (Xdg-desktop-portal-gtk), match:title (Save As)

# Регулятор громкости Pavucontrol
windowrule = float on, match:class (org.pulseaudio.pavucontrol)
windowrule = size 60% 70%, match:class (org.pulseaudio.pavucontrol)
windowrule = move 39% 28%, match:class (org.pulseaudio.pavucontrol)
windowrule = dim_around on, match:class (org.pulseaudio.pavucontrol)


# Уведомления
layerrule = blur on, match:namespace notifications
layerrule = ignore_alpha 0.0, match:namespace notifications

# Лаунчер (rofi/wofi и т.д.)
layerrule = blur on, match:namespace launcher

# Панель Waybar
layerrule = blur on, match:namespace waybar








